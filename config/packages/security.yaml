security:
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'

    providers:
        app_user_provider:
            entity:
                class: App\Entity\User
                property: email

    firewalls:
        dev:
            pattern: ^/(_(profiler|wdt)|css|images|js)/
            security: false

        public:
            pattern: ^/api/(login|register|token/refresh|doc)
            stateless: true
            security: false

        api:
            pattern: ^/api
            stateless: true
            entry_point: jwt
            jwt: ~
            # Permettre l'accès anonyme
            lazy: true

    access_control:
        - { path: ^/api/login, roles: PUBLIC_ACCESS }
        - { path: ^/api/register, roles: PUBLIC_ACCESS }
        - { path: ^/api/token/refresh, roles: PUBLIC_ACCESS }
        - { path: ^/api/doc, roles: PUBLIC_ACCESS }

        # Routes publiques en GET
        - { path: ^/api/sports$, roles: PUBLIC_ACCESS, methods: [ GET ] }
        - { path: ^/api/profiles, roles: PUBLIC_ACCESS, methods: [ GET ] }
        - { path: ^/api/venues, roles: PUBLIC_ACCESS, methods: [ GET ] }
        - { path: ^/api/reviews, roles: PUBLIC_ACCESS, methods: [ GET ] }

        - { path: ^/api/admin, roles: ROLE_ADMIN }
        - { path: ^/api, roles: ROLE_USER }

when@test:
    security:
        password_hashers:
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: auto
                cost: 4
                time_cost: 3
                memory_cost: 10

security:
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'

    role_hierarchy:
        ROLE_ADMIN: [ ROLE_COACH, ROLE_USER ]
        ROLE_COACH: ROLE_USER

    providers:
        app_user_provider:
            entity:
                class: App\Entity\User
                property: email

    firewalls:
        dev:
            pattern: ^/(_(profiler|wdt)|css|images|js)/
            security: false

        # 1. On gère le login et le throttling ici
        login:
            pattern: ^/api/login
            stateless: true
            login_throttling:
                max_attempts: 5
                interval: '15 minutes'
            json_login:
                check_path: /api/login
                username_path: email
                password_path: password
                success_handler: lexik_jwt_authentication.handler.authentication_success
                failure_handler: lexik_jwt_authentication.handler.authentication_failure

        # 2. On gère toute l'API sécurisée
        api:
            pattern: ^/api
            stateless: true
            entry_point: jwt
            jwt: ~
            # Pas besoin de login_throttling ici car c'est du JWT sans mot de passe

    access_control:
        - { path: ^/api/login, roles: PUBLIC_ACCESS }
        - { path: ^/api/register, roles: PUBLIC_ACCESS }
        - { path: ^/api/token/refresh, roles: PUBLIC_ACCESS }
        - { path: ^/api/doc, roles: PUBLIC_ACCESS }

        # Routes publiques en GET
        - { path: ^/api/sports$, roles: PUBLIC_ACCESS, methods: [ GET ] }
        - { path: ^/api/profiles, roles: PUBLIC_ACCESS, methods: [ GET ] }
        - { path: ^/api/venues, roles: PUBLIC_ACCESS, methods: [ GET ] }
        - { path: ^/api/reviews, roles: PUBLIC_ACCESS, methods: [ GET ] }

        # Routes protégées
        - { path: ^/api/admin, roles: ROLE_ADMIN }
        - { path: ^/api, roles: ROLE_USER }

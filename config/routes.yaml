# Charge automatiquement tous les contrôleurs avec des attributs #[Route]
controllers:
    resource:
        path: ../src/Controller/
        namespace: App\Controller
    type: attribute

# Routes spécifiques (si nécessaire)
api_login:
    path: /api/login
    methods: ['POST']

api_register:
    path: /api/register
    methods: ['POST']
    controller: App\Controller\AuthController::register

# Documentation API Swagger
app.swagger_ui:
    path: /api/doc
    methods: GET
    defaults: { _controller: nelmio_api_doc.controller.swagger_ui }

app.swagger:
    path: /api/doc.json
    methods: GET
    defaults: { _controller: nelmio_api_doc.controller.swagger }
